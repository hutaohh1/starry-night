<html lang="zh-CN">

  <title>星月夜 · 流动的笔触</title>
  <style>

<body>
  <div class="app">
    <header><div><h1>星月夜</h1><p class="subtitle">流动的笔触，旋转的夜空</p></div><div class="signature">The Starry Night<small>向文森特·梵高致意 · 1889</small></div></header>
    <main><div class="painting" id="painting"><canvas id="sky" role="img" aria-label="梵高星月夜风格的流动星空，明亮的蓝青色笔触围绕金黄色星体旋转，下方是起伏的光带。"></canvas><span class="hint">空格 暂停 / 继续 &nbsp; · &nbsp; F 全屏 &nbsp; · &nbsp; S 保存</span></div></main>
    <div class="toolbar" aria-label="动画控制">
      <button id="pause" class="primary" aria-pressed="false">暂停流动</button>
      <label class="control" for="speed">流动速度 <input id="speed" type="range" min="0.25" max="2" step="0.05" value="1"><output id="speed-value" for="speed">1.00×</output></label>
      <label class="control" for="density">笔触密度 <input id="density" type="range" min="8000" max="36000" step="1000" value="22000"><output id="density-value" for="density">22000</output></label>
      <label class="control" for="bloom">辉光 <input id="bloom" type="range" min="0" max="1.8" step="0.05" value="0.30"><output id="bloom-value" for="bloom">0.30</output></label>
      <label class="control" for="exposure">曝光 <input id="exposure" type="range" min="0.6" max="2" step="0.05" value="1.0"><output id="exposure-value" for="exposure">1.00</output></label>
      <div class="actions"><button id="reset">重新绘制</button><button id="save">保存图片</button><button id="fullscreen">全屏欣赏</button></div>
    </div>
    <footer class="footer"><span>以粒子为颜料，以风为画笔</span><span id="status" role="status" aria-live="polite">正在铺开夜色…</span></footer>
  </div>

  }
  try{gpu=new FilmRenderer(canvas)}catch(error){console.warn('Using Canvas fallback:',error.message);const replacement=canvas.cloneNode();canvas.replaceWith(replacement);canvas=replacement;ctx=canvas.getContext('2d',{alpha:false});document.querySelector('#bloom').disabled=true;document.querySelector('#exposure').disabled=true}

  const ink=document.createElement('canvas'),paint=ink.getContext('2d',{alpha:!!gpu});
  const W=1.6,H=1, TAU=Math.PI*2;
  const vortices=[
    {x:.83,y:.285,r:.16,s:-.36,warm:false},
    {x:.485,y:.565,r:.086,s:-.24,warm:true},
    {x:1.14,y:.555,r:.083,s:.21,warm:false},
    {x:1.445,y:.565,r:.058,s:-.15,warm:false},
    {x:1.48,y:.155,r:.10,s:-.24,warm:true},
    {x:.17,y:.155,r:.055,s:.14,warm:true},
    {x:.425,y:.305,r:.072,s:.17,warm:false},
    {x:.62,y:.115,r:.032,s:-.095,warm:true},
    {x:1.24,y:.095,r:.055,s:.12,warm:true},
    {x:.13,y:.455,r:.072,s:-.13,warm:false},
    {x:1.36,y:.375,r:.046,s:.1,warm:true}
  ];
  const cold=['#15334b','#24566f','#3b849f','#63adbe','#95cbd0','#c2ddd4','#e4e9cb'];
  const gold=['#4c4d27','#868036','#b6a840','#d5bf50','#edd36b','#ffe59a','#fff0b3'];
  let seed=1889,particles=[],running=!matchMedia('(prefers-reduced-motion: reduce)').matches,speed=1,density=22000,scale=800,last=0,acc=0,ticks=0,resizeTimer,warming=false;
  let preferences={};try{preferences=JSON.parse(localStorage.getItem('starry-night-preferences')||'{}')||{}}catch{}
  const query=new URLSearchParams(location.search);
  function choice(name,min,max,fallback){const raw=preferences[name]??query.get(name);if(raw===null||raw===undefined)return fallback;const value=Number(raw);return Number.isFinite(value)?Math.min(max,Math.max(min,value)):fallback}
  speed=choice('speed',.25,2,1);density=Math.round(choice('density',8000,36000,22000)/1000)*1000;bloom=choice('bloom',0,1.8,.3);exposure=choice('exposure',.6,2,1);
  function remember(){try{localStorage.setItem('starry-night-preferences',JSON.stringify({speed,density,bloom,exposure}))}catch{}}
  for(const [name,value]of Object.entries({speed,density,bloom,exposure})){document.querySelector('#'+name).value=value;document.querySelector('#'+name+'-value').textContent=name==='speed'?value.toFixed(2)+'×':name==='density'?value:value.toFixed(2)}
  remember();
  function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
  function field(x,y){

  }
  function emphasis(x,y){

    for(const v of vortices){const r=Math.hypot(x-v.x,(y-v.y)/.85)/v.r;
      const angle=Math.atan2((y-v.y)/.85,x-v.x);
      const brush=.78+.22*Math.sin(angle*2+Math.log(r+.15)*2.4+v.x*4);

  function colorAt(x,y,tone){

  function particle(initial=false){

  function background(){

  function present(){if(gpu)gpu.render();else ctx.drawImage(ink,0,0)}
  function step(dt=1,show=true){

      let p=particles[i];p.age+=dt;if(p.age>p.life||p.x<-.12||p.x>1.72||p.y<-.12||p.y>1.12){p=particles[i]=particle()}
      const d=field(p.x,p.y),nx=p.x+d[0]*.018*dt,ny=p.y+d[1]*.018*dt;
      paint.strokeStyle=colorAt(p.x,p.y,p.tone);paint.globalAlpha=(.3+.4*Math.sin(p.phase+p.age*.025)**2)*emphasis(p.x,p.y);paint.lineWidth=p.width*scale/800;
      paint.beginPath();paint.moveTo(p.x*scale,p.y*scale);paint.lineTo(nx*scale,ny*scale);paint.stroke();p.x=nx;p.y=ny;
    }
    paint.globalAlpha=1;if(gpu)gpu.advance(ink,dt);ticks++;if(show)present();
  }
  function setup(){
    const rect=canvas.getBoundingClientRect();scale=Math.min(1600,Math.max(600,rect.width*Math.min(devicePixelRatio||1,2)/W));
    for(const c of [canvas,under,ink]){c.width=Math.round(scale*W);c.height=Math.round(scale)}
    if(gpu)gpu.resize(canvas.width,canvas.height);
    seed=1889;background();if(gpu)gpu.setBase(under);particles=Array.from({length:density},()=>particle(true));
    // Render in batches, so initialization never locks the controls for seconds.
    let remaining=75;warming=true;const epoch=++setup.epoch;
    function warm(){if(epoch!==setup.epoch)return;for(let i=0;i<4&&remaining>0;i++,remaining--)step(1,false);present();if(remaining>0)requestAnimationFrame(warm);else{warming=false;document.querySelector('#status').textContent=running?'夜色正在流动':'已暂停 · 点击继续欣赏';last=0}}
    warm();
  }
  setup.epoch=0;
  function animate(now){requestAnimationFrame(animate);if(document.hidden||!running||warming){last=now;return}if(!last)last=now;acc+=Math.min(80,now-last);last=now;if(acc>=1000/30){const dt=Math.min(2,acc/(1000/30))*speed;acc=0;step(dt)}}
  function toggle(){running=!running;const b=document.querySelector('#pause');b.textContent=running?'暂停流动':'继续流动';b.setAttribute('aria-pressed',String(!running));document.querySelector('#status').textContent=running?'夜色正在流动':'已暂停 · 点击继续欣赏'}
  function save(){const a=document.createElement('a');a.download='星月夜-'+new Date().toISOString().replace(/[:.]/g,'-')+'.png';a.href=canvas.toDataURL('image/png');a.click();document.querySelector('#status').textContent='已保存当前画面'}
  async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.querySelector('#painting').requestFullscreen()}catch{document.querySelector('#status').textContent='此环境不支持全屏，可在浏览器中打开'}}
  document.querySelector('#pause').onclick=toggle;
  document.querySelector('#save').onclick=save;
  document.querySelector('#fullscreen').onclick=fullscreen;
  document.querySelector('#reset').onclick=setup;
  document.querySelector('#speed').oninput=e=>{speed=+e.target.value;document.querySelector('#speed-value').textContent=speed.toFixed(2)+'×';remember()};
  document.querySelector('#density').oninput=e=>{density=+e.target.value;document.querySelector('#density-value').textContent=density;while(particles.length<density)particles.push(particle(true));particles.length=density;remember()};
  document.querySelector('#bloom').oninput=e=>{bloom=+e.target.value;document.querySelector('#bloom-value').textContent=bloom.toFixed(2);present();remember()};
  document.querySelector('#exposure').oninput=e=>{exposure=+e.target.value;document.querySelector('#exposure-value').textContent=exposure.toFixed(2);present();remember()};
  document.addEventListener('keydown',e=>{if(/INPUT|BUTTON/.test(e.target.tagName)||e.ctrlKey||e.altKey||e.metaKey)return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.key.toLowerCase()==='f')fullscreen();if(e.key.toLowerCase()==='s')save()});
  new ResizeObserver(()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(setup,200)}).observe(document.querySelector('#painting'));
  if(!running){document.querySelector('#pause').textContent='继续流动';document.querySelector('#pause').setAttribute('aria-pressed','true')}
  setup();requestAnimationFrame(animate);
  </script>
</body>
</html>
